name: Deploy Laravel to DomaiNesia

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, fileinfo, openssl

      - name: Install Composer Dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader --ignore-platform-reqs

      - name: Setup Node.js & Build Vite
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run NPM Build
        run: npm ci && npm run build

      - name: Sync via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          server-dir: '/'
          exclude: |
            **/.git*
            **/node_modules/**
            .env
            *.md

      - name: Trigger Migration Webhook
        run: |
          curl -sS -k "https://classprogress.web.id/api/deploy-migrate-${{ secrets.DEPLOY_SECRET }}?seed=1"